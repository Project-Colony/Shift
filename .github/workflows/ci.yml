name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# No system packages on Linux: rfd's default features use the XDG portal, not
# GTK, and wayland-sys is loaded at runtime (its dlopen feature is on), so
# nothing needs a -dev package to link.

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --locked

  # rust-version in Cargo.toml is a promise about who can build Shift; an
  # untested floor is a guess. RUSTUP_TOOLCHAIN pins every cargo call to it,
  # and the rustc check fails loudly if that pin ever stops working.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Test on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo test --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt

      - name: Formatting
        run: cargo fmt --check
