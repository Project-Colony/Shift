[package]
name = "shift"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast, local, keyboard-friendly image viewer"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Shift"

[dependencies]
# Codecs come from the direct `image` dependency below, which iced shares, so
# only the formats Shift lists in SUPPORTED_EXTENSIONS are compiled in.
iced = { version = "0.14.0", features = ["image-without-codecs", "tokio"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# The Colony theme, fonts, shared labels and Preferences kit. It is built on
# iced 0.14, so iced stays on 0.14 with it.
colony-ui = "0.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Reads the system language on Linux, Windows and macOS for the Automatic
# language setting. Already in the tree through iced.
sys-locale = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
